name: Performance Tests

on:
  pull_request:
    branches:
      - main
      - fixing

permissions:
  contents: read
  pull-requests: write

jobs:
  performance:
    name: Lighthouse Performance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Run Lighthouse Performance Tests
        uses: treosh/lighthouse-ci-action@v1
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          tempStorage: github
          onlyCategories: |
            - performance
            - accessibility
            - best-practices
            - seo
            - pwa
          additionalOptions: --preset=desktop
          jsonReportPath: lighthouse-results.json
          htmlReportPath: lighthouse-results.html

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lighthouse Report
          path: |
            lighthouse-results.json
            lighthouse-results.html
          retention-days: 7

      - name: Post Results to PR
        uses: testbar/action-report-lighthouse@v4
        if: always()
        with:
          report-json-path: ./lighthouse-results.json
          pr-number: ${{ github.event.pull_request.number }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
